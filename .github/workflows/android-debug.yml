name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Android Debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/aurora-adventure-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-adventure-debug
          path: build/aurora-adventure-debug.apk
          if-no-files-found: error
          retention-days: 14
          
